<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハッピーバースデー</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 32px;
    letter-spacing: 0.05em;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(3, 64px);
    gap: 16px;
    justify-content: center;
  }
  li a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border: 1px solid #555;
    border-radius: 8px;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    transition: background 0.2s;
  }
  li a:hover {
    background: #333;
  }
</style>
</head>
